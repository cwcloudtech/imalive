version: "3.9"

services:
  imalive-api:
    restart: always
    image: imalive-api:latest
    container_name: imalive-api
    build:
      context: .
      dockerfile: ./Dockerfile
      target: api
    env_file: 
      - .env
    ports:
      - "8080:8080"
    networks:
      - imalive-net
  imalive-tests:
    build:
      context: .
      dockerfile: ./Dockerfile
      target: unit_tests
    networks:
      - imalive-net

networks:
  imalive-net:
