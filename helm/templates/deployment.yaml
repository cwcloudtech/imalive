---
apiVersion: {{ include "common.capabilities.deployment.apiVersion" $ }}
kind: Deployment
metadata:
  labels:
    app: {{ include "common.names.fullname" . }}
  name: {{ include "common.names.fullname" . }}
spec:
  replicas: {{ $.Values.replicas }}
  selector:
    matchLabels:
      app: {{ include "common.names.fullname" . }}
  template:
    metadata:
      labels:
        app: {{ include "common.names.fullname" . }}
    spec:
      containers:
        - image: {{ print $.Values.image.path ":" $.Values.image.tag}}
          name: {{ include "common.names.fullname" . }}
          ports:
            - containerPort: 8080

          volumeMounts:
            - name: imalive-config
              mountPath: /app/imalive.yml
              subPath: imalive.yml

          env:
            - name: IMALIVE_NODE_NAME
              value: {{ include "common.names.fullname" . }}
            - name: WAIT_TIME
              value: {{ $.Values.wait_time | quote }}
            - name: LOG_LEVEL
              value: {{ $.Values.log.level | quote }}

            {{ if $.Values.otlp_endpoint }}
            - name: OTEL_COLLECTOR_ENDPOINT
              value: {{ $.Values.otlp_endpoint | quote }}
            {{ end }}

            {{ if $.Values.otlp_tls_check }}
            - name: OTEL_COLLECTOR_TLS_CHECK
              value: {{ $.Values.otlp_tls_check | quote }}
            {{ end }}

            {{ if $.Values.otlp_username }}
            - name: OTEL_COLLECTOR_USERNAME
              value: {{ $.Values.otlp_username | quote }}
            {{ end }}

            {{ if $.Values.otlp_password }}
            - name: OTEL_COLLECTOR_PASSWORD
              value: {{ $.Values.otlp_password | quote }}
            {{ end }}

            {{ if $.Values.otlp_auth_header }}
            - name: OTEL_COLLECTOR_AUTH_HEADER
              value: {{ $.Values.otlp_auth_header | quote }}
            {{ end }}

            {{ if $.Values.webhook_url }}
            - name: WEBHOOK_URL
              value: {{ $.Values.webhook_url | quote }}
            {{ end }}

            {{ if $.Values.webhook_auth_header_name }}
            - name: WEBHOOK_AUTH_HEADER_NAME
              value: {{ $.Values.webhook_auth_header_name | quote }}
            {{ end }}

            {{ if $.Values.webhook_auth_header_value }}
            - name: WEBHOOK_AUTH_HEADER_VALUE
              value: {{ $.Values.webhook_auth_header_value | quote }}
            {{ end }}

          {{- if .Values.extraEnvFrom }}
          envFrom:
          {{- with .Values.extraEnvFrom }}
            {{- toYaml . | nindent 6 }}
          {{- end }}
          {{- end }}

      restartPolicy: {{ $.Values.restartPolicy }}

      volumes:
        - name: imalive-config
          configMap:
            name: imalive-config
